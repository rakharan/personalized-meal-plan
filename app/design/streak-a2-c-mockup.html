<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saji — Streak A2 + C Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDF8F2; --surface2: #F7F1E8;
    --brown: #3D2C1E; --brown-2: #6B5138;
    --green: #5C8A4D; --amber: #E8A33D;
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
  body { background: var(--surface2); padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .label { font-size: 13px; font-weight: 700; color: var(--brown-2); text-transform: uppercase; letter-spacing: 1px; }
  .frames { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
  .phone { width: 340px; background: var(--bg); border-radius: 36px; border: 8px solid #2B2118; overflow: hidden; box-shadow: 0 24px 48px rgba(61,44,30,.18); }
  .screen { padding: 20px 18px 28px; }

  .streak-hero {
    background: linear-gradient(135deg, #3D2C1E 0%, #5A3A22 100%);
    border-radius: var(--radius); padding: 22px 20px; color: #FDF8F2;
    display: flex; align-items: center; gap: 18px;
  }

  /* ═══ A2: emoji + pulse glow + embers ═══ */
  .flame-zone { position: relative; width: 76px; height: 76px; display: grid; place-items: center; flex-shrink: 0; }
  .glow {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,154,61,.5) 0%, rgba(255,154,61,0) 70%);
    animation: glowPulse 2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: .8; }
    50% { transform: scale(1.25); opacity: 1; }
  }
  .fire-emoji {
    font-size: 46px; position: relative; z-index: 2;
    animation: firePulse 2s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(255,122,26,.55));
  }
  @keyframes firePulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.1) rotate(-3deg); }
    60% { transform: scale(.97) rotate(2deg); }
  }
  .ember {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: #FFD27A; opacity: 0; z-index: 1;
    animation: rise 2.6s ease-in infinite;
  }
  .ember.e1 { left: 18px; bottom: 30px; animation-delay: 0s; }
  .ember.e2 { left: 52px; bottom: 34px; animation-delay: .9s; width: 4px; height: 4px; }
  .ember.e3 { left: 34px; bottom: 26px; animation-delay: 1.7s; width: 3px; height: 3px; }
  .ember.e4 { left: 44px; bottom: 40px; animation-delay: 2.2s; width: 4px; height: 4px; background: #FF9A3D; }
  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    20% { opacity: .9; }
    100% { transform: translateY(-64px) translateX(10px) scale(.3); opacity: 0; }
  }

  .streak-num { font-size: 44px; font-weight: 800; line-height: 1;
    background: linear-gradient(180deg, #FFD27A, #FF9A3D);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .streak-label { font-size: 13px; font-weight: 600; opacity: .85; margin-top: 2px; }
  .streak-days { display: flex; gap: 5px; margin-top: 10px; }
  .streak-dot { width: 22px; height: 22px; border-radius: 8px; display: grid; place-items: center;
    font-size: 10px; font-weight: 700; background: rgba(255,255,255,.12); color: rgba(255,255,255,.5); }
  .streak-dot.done { background: var(--amber); color: var(--brown); }
  .streak-dot.today { outline: 2px solid #FFD27A; outline-offset: 1px; }

  /* ═══ C: reward moment — tap to simulate cook ═══ */
  .c-wrap { position: relative; overflow: hidden; }
  .c-num { font-size: 44px; font-weight: 800; line-height: 1; color: #FFD27A; transition: none; }
  .c-num.pop { animation: numPop .5s cubic-bezier(.2, 2.2, .4, 1); }
  @keyframes numPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.45); color: #FFF3D6; }
    100% { transform: scale(1); }
  }
  .confetti {
    position: absolute; width: 8px; height: 8px; opacity: 0; z-index: 5; pointer-events: none;
  }
  .confetti.burst { animation: burst 1.1s cubic-bezier(.15,.6,.4,1) forwards; }
  @keyframes burst {
    0% { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.6); opacity: 0; }
  }
  .cook-btn {
    margin-top: 14px; padding: 10px 18px; border: none; border-radius: 999px;
    background: var(--green); color: white; font-weight: 800; font-size: 13px; cursor: pointer;
  }
  .hint { font-size: 11px; opacity: .6; margin-top: 8px; }
</style>
</head>
<body>

<div class="label">A2 — animated emoji flame &nbsp;·&nbsp; C — reward moment (tap "Sudah masak")</div>

<div class="frames">

  <!-- A2 -->
  <div>
    <div class="label" style="margin-bottom:10px">A2 — flame emoji + glow + embers</div>
    <div class="phone"><div class="screen">
      <div class="streak-hero">
        <div class="flame-zone">
          <div class="glow"></div>
          <div class="fire-emoji">🔥</div>
          <div class="ember e1"></div><div class="ember e2"></div><div class="ember e3"></div><div class="ember e4"></div>
        </div>
        <div>
          <div class="streak-num">5 hari</div>
          <div class="streak-label">streak masak</div>
          <div class="streak-days">
            <div class="streak-dot done">S</div><div class="streak-dot done">S</div>
            <div class="streak-dot done">R</div><div class="streak-dot done">K</div>
            <div class="streak-dot done">J</div><div class="streak-dot today">S</div>
            <div class="streak-dot">M</div>
          </div>
        </div>
      </div>
    </div></div>
  </div>

  <!-- C -->
  <div>
    <div class="label" style="margin-bottom:10px">C — tap button, streak pops + confetti</div>
    <div class="phone"><div class="screen">
      <div class="streak-hero c-wrap" id="cHero">
        <div class="flame-zone"><div class="fire-emoji">🔥</div></div>
        <div>
          <div class="c-num" id="cNum">4 hari</div>
          <div class="streak-label">streak masak</div>
          <button class="cook-btn" id="cookBtn">✓ Sudah masak</button>
          <div class="hint">tap untuk simulasi</div>
        </div>
      </div>
    </div></div>
  </div>

</div>

<script>
  const hero = document.getElementById('cHero');
  const num = document.getElementById('cNum');
  const btn = document.getElementById('cookBtn');
  let streak = 4, busy = false;
  const colors = ['#FFD27A','#FF9A3D','#5C8A4D','#E8A33D','#FFF3D6'];
  btn.addEventListener('click', () => {
    if (busy) return; busy = true;
    streak++;
    num.textContent = streak + ' hari';
    num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop');
    // confetti burst from button position
    const r = btn.getBoundingClientRect(), h = hero.getBoundingClientRect();
    for (let i = 0; i < 14; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (r.left - h.left + r.width/2) + 'px';
      c.style.top = (r.top - h.top) + 'px';
      c.style.background = colors[i % colors.length];
      c.style.borderRadius = i % 2 ? '50%' : '2px';
      const ang = (Math.PI * 2 * i) / 14 + Math.random() * .5;
      const dist = 60 + Math.random() * 50;
      c.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      c.style.setProperty('--dy', (Math.sin(ang) * dist - 40) + 'px');
      c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      hero.appendChild(c);
      requestAnimationFrame(() => c.classList.add('burst'));
      setTimeout(() => c.remove(), 1200);
    }
    setTimeout(() => { busy = false; }, 1100);
  });
</script>

</body>
</html>
