<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Saji story template — 1080x1920 vertical -->
  <!-- Background gradient (warm kitchen) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1612"/>
      <stop offset="100%" stop-color="#241F1B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#74C69D"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="540" cy="450" r="180" fill="none" stroke="#52B788" stroke-width="4" opacity="0.15"/>
  <circle cx="540" cy="450" r="120" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.15"/>
  <circle cx="540" cy="450" r="60" fill="#52B788" opacity="0.1"/>

  <!-- Brand -->
  <text x="540" y="250" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="700" fill="#E8E0D5" letter-spacing="-1">Saji 🍽️</text>
  <text x="540" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="400" fill="#8A7E72">Asisten makan harian</text>

  <!-- Headline -->
  <text x="540" y="780" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="80" font-weight="700" fill="#E8E0D5" letter-spacing="-3">
    <tspan x="540" dy="0">Mau makan</tspan>
    <tspan x="540" dy="96">enak hari ini?</tspan>
  </text>

  <!-- Subtitle -->
  <text x="540" y="1040" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="400" fill="#C4B8A8">
    <tspan x="540">Rencana makan harian</tspan>
    <tspan x="540" dy="50">pakai bahan lokal Indonesia</tspan>
  </text>

  <!-- Feature pills -->
  <rect x="290" y="1200" width="500" height="70" rx="35" fill="#241F1B" stroke="#52B788" stroke-width="2"/>
  <text x="540" y="1245" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="500" fill="#52B788">🎯 Sesuai goal · 🥘 Bahan lokal</text>

  <rect x="290" y="1300" width="500" height="70" rx="35" fill="#241F1B" stroke="#F59E0B" stroke-width="2"/>
  <text x="540" y="1345" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="500" fill="#F59E0B">🔥 Streak harian · 📊 Makro</text>

  <!-- CTA -->
  <rect x="340" y="1500" width="400" height="80" rx="40" fill="url(#accent)"/>
  <text x="540" y="1552" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="700" fill="#1A1612">Mulai dong! →</text>

  <!-- Swipe up indicator -->
  <text x="540" y="1750" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="400" fill="#5C5248">↑ Swipe up untuk mulai</text>

  <!-- Bottom branding -->
  <text x="540" y="1850" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="400" fill="#5C5248">@personalized_meal_planner_bot</text>
</svg>
